# Foydali — foydali.xisobchim.uz (deploy/foydali/foydali-setup.sh -> /etc/nginx/sites-available/foydali)
# Boshqa saytlar (bio-lab.uz) bilan to'qnashmasligi uchun barcha nomlar «foydali_» bilan boshlanadi.
# HTTPS: certbot --nginx shu faylga 443 blokini o'zi qo'shadi.

upstream foydali_backend  { server 127.0.0.1:8020; keepalive 16; }   # Django + Channels (systemd: foydali-backend)
upstream foydali_frontend { server 127.0.0.1:3020; keepalive 16; }   # Next.js (pm2: foydali-frontend)
upstream foydali_qrdrive  { server 127.0.0.1:8120; }                 # QR Drive API (systemd: foydali-qrdrive-api)
upstream foydali_control  { server 127.0.0.1:8920; }                 # boshqaruv markazi (systemd: foydali-control)

map $http_upgrade $foydali_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 12m;
    access_log /var/log/nginx/foydali.access.log;
    error_log  /var/log/nginx/foydali.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # WebSocket uchun; oddiy so'rovlarda bo'sh (keepalive). Diqqat: location ichida proxy_set_header yozilsa,
    # bu yerdagilar meros bo'lmaydi — shuning uchun hammasi shu yerda.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $foydali_connection;
    proxy_redirect off;

    # API (AI so'rovlari uzoq bo'lishi mumkin)
    location /api/ {
        proxy_pass http://foydali_backend;
        proxy_read_timeout 200s;
    }

    # Jonli yangilanishlar (WebSocket)
    location /ws/ {
        proxy_pass http://foydali_backend;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Django admin va statik fayllar (whitenoise beradi)
    location ~ ^/(admin|static)/ {
        proxy_pass http://foydali_backend;
    }

    # QR Drive: panel API, tashqi API v1, ommaviy havolalar (/qrdrive/s/...), katta fayl yuklash (/qrdrive/u/...)
    location /qrdrive/ {
        proxy_pass http://foydali_qrdrive;
        client_max_body_size 2100m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Servislar boshqaruv markazi (o'z paroli bilan: /etc/foydali/foydali-control.env)
    location = /control { return 301 /control/; }
    location /control/ {
        proxy_pass http://foydali_control/;
        proxy_read_timeout 120s;
    }

    # Interfeys (Next.js)
    location / {
        proxy_pass http://foydali_frontend;
        proxy_read_timeout 120s;
    }
}
