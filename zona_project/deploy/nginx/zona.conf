# Nginx: bitta domen — frontend (Next.js :3000), API va WebSocket (Django :8000).
# install.sh __DOMAIN__ ni almashtiradi va /etc/nginx/sites-available/zona ga qo'yadi.
# HTTPS: sudo certbot --nginx -d __DOMAIN__   (certbot shu faylga 443 blokini o'zi qo'shadi)

upstream zona_backend  { server 127.0.0.1:8000; }
upstream zona_frontend { server 127.0.0.1:3000; }
upstream zona_qrdrive  { server 127.0.0.1:8100; }
upstream zona_control  { server 127.0.0.1:8900; }  # servislar boshqaruv markazi  # QR Drive mikroservisi (alohida jarayon)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMAIN__;

    # Excel/JSON/HTML import (5 MB fayl base64 bilan ~7 MB)
    client_max_body_size 12m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # API (AI so'rovlari uzoq bo'lishi mumkin)
    location /api/ {
        proxy_pass http://zona_backend;
        proxy_read_timeout 200s;
    }

    # Jonli yangilanishlar (WebSocket)
    location /ws/ {
        proxy_pass http://zona_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # QR Drive: panel API, tashqi API v1 (Swagger: /qrdrive/api/docs), ommaviy havolalar (/qrdrive/s/...)
    location /qrdrive/ {
        proxy_pass http://zona_qrdrive;
        client_max_body_size 2100m;      # 2 GB gacha (amaldagi chegara — bot sozlamalaridagi limit)
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Servislar boshqaruv markazi (o'z paroli bilan). Ishonchli IP'lar bilan cheklash tavsiya etiladi:
    #   allow 10.0.0.0/8; deny all;
    location = /control { return 301 /control/; }
    location /control/ {
        proxy_pass http://zona_control/;
        proxy_read_timeout 120s;
    }

    # Django admin va uning statik fayllari
    location /admin/ {
        proxy_pass http://zona_backend;
    }
    location /static/ {
        alias /opt/zona/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Interfeys
    location / {
        proxy_pass http://zona_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
