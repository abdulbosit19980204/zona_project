[project]
name = "qrdrive"
version = "0.1.0"
description = "QR Drive: fayl -> saqlash joyi -> ommaviy havola -> QR. Mustaqil mikroservis (API, worker, Telegram bot)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "httpx>=0.27",
    "aiogram>=3.13",
    "qrcode>=7.4",
    "pillow>=10.4",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "moto[s3]>=5", "py7zr>=0.21"]

[project.scripts]
qrdrive-api = "qrdrive.main:run_api"
qrdrive-worker = "qrdrive.worker.main:run"
qrdrive-bot = "qrdrive.bot.main:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qrdrive*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
